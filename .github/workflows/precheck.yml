name: Module precheck

# Gate for every change that targets master. The deploy job publishes whatever
# changed, and the marketplace stores exactly one version per module, so a
# module that ships under an unchanged version is invisible downstream — this is
# where that gets caught.

on:
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: precheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Versions incremented
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check diffs against the merge base, so the history that reaches
          # back to it has to be present.
          fetch-depth: 0

      - name: Check module versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            base="$BASE_SHA"
          else
            base="$(./ci/scripts/base-ref.sh)"
          fi
          echo "Comparing against $base"
          ./ci/scripts/check-versions.sh "$base"

      - name: Summarise what would deploy
        if: success()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-$(./ci/scripts/base-ref.sh)}"
          {
            echo "### Modules this PR would publish"
            echo
            changed="$(./ci/scripts/list-changed.sh "$base" HEAD)"
            if [ -z "$changed" ]; then
              echo "_None — no module files changed._"
            else
              echo "| Module | Version |"
              echo "|---|---|"
              while IFS= read -r mod; do
                [ -z "$mod" ] && continue
                printf '| `%s` | %s |\n' \
                  "$(./ci/scripts/manifest.py get "$mod/manifest.json" id)" \
                  "$(./ci/scripts/manifest.py get "$mod/manifest.json" version)"
              done <<< "$changed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Packages build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pulled from a public GHCR package, so this job needs no secrets and
      # still runs on pull requests from forks.
      - name: Fetch marketplace CLI
        uses: ./.github/actions/marketplace-cli

      # A dry-run publish parses each changed module's manifest exactly the way a
      # real deploy would, so a malformed or mis-identified manifest fails here
      # rather than halfway through the deploy.
      - name: Validate changed modules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-$(./ci/scripts/base-ref.sh)}"
          changed="$(./ci/scripts/list-changed.sh "$base" HEAD)"
          if [ -z "$changed" ]; then
            echo "No module changes to validate."
            exit 0
          fi
          while IFS= read -r mod; do
            [ -z "$mod" ] && continue
            echo "--- $mod"
            ./marketplace-cli publish --dry-run "$mod"
          done <<< "$changed"
