name: Deploy modules

# On merge to master, publish every module whose files changed and retire every
# module whose directory was deleted.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      modules:
        description: 'Space-separated module directories to publish (blank = whatever changed in the last commit)'
        required: false
        default: ''

concurrency:
  # Never let two deploys race for the same module's R2 object. Queue instead of
  # cancelling: a cancelled publish is the one case that can leave a module
  # mid-swap.
  group: deploy-modules
  cancel-in-progress: false

permissions:
  contents: write # to push the per-module release tags

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      API: ${{ vars.MARKETPLACE_API_URL }}
      # Required by the marketplace on every state-changing request. Only this
      # job needs it: the precheck validates with a dry run that makes no API
      # calls, so pull requests from forks keep working without secrets.
      API_TOKEN: ${{ secrets.MARKETPLACE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch marketplace CLI
        uses: ./.github/actions/marketplace-cli

      # Fail here with a clear message rather than as a 401 partway through
      # publishing, which would leave some modules updated and others not.
      - name: Check the publish token is configured
        run: |
          if [ -z "${API_TOKEN:-}" ]; then
            echo "::error title=Missing publish token::Set the MARKETPLACE_API_TOKEN repository secret to the marketplace's API_TOKEN value."
            exit 1
          fi

      - name: Resolve what changed
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          MANUAL: ${{ github.event.inputs.modules }}
        run: |
          set -euo pipefail

          if [ -n "${MANUAL:-}" ]; then
            echo "Manual run for: $MANUAL"
            printf '%s\n' $MANUAL > changed.txt
          else
            # github.event.before is all zeroes for a branch's first push, and
            # points at a discarded commit after a force-push. Fall back to the
            # previous commit in either case.
            base="${BEFORE:-}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
            echo "Comparing $base..HEAD"
            ./ci/scripts/list-changed.sh "$base" HEAD > changed.txt
            echo "base=$base" >> "$GITHUB_OUTPUT"
          fi

          echo "Modules to publish:"
          cat changed.txt
          if [ -s changed.txt ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      # Guards a direct push to master that skipped the PR check. Publishing a
      # changed module under an unchanged version would silently overwrite the
      # release everyone downstream already has.
      - name: Verify versions were incremented
        if: steps.changed.outputs.any == 'true' && github.event.inputs.modules == ''
        run: ./ci/scripts/check-versions.sh "${{ steps.changed.outputs.base }}"

      # A deleted module is invisible to everything above: discovery reads the
      # working tree, so a directory that no longer exists can be attributed no
      # changed files and is never published. Left at that, a module deleted here
      # would keep serving its last build from the marketplace forever.
      #
      # A manual run names the modules to publish and has no base to diff, so it
      # never removes anything — same guard as the version check.
      - name: Resolve what was removed
        id: removed
        if: github.event.inputs.modules == ''
        env:
          BASE: ${{ steps.changed.outputs.base }}
        run: |
          set -euo pipefail
          ./ci/scripts/list-removed.sh "$BASE" HEAD > removed.txt

          echo "Modules to remove:"
          cat removed.txt
          if [ -s removed.txt ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.changed.outputs.any == 'true'
        run: |
          set -euo pipefail
          failed=""
          while IFS= read -r mod; do
            [ -z "$mod" ] && continue
            id="$(./ci/scripts/manifest.py get "$mod/manifest.json" id)"
            version="$(./ci/scripts/manifest.py get "$mod/manifest.json" version)"
            echo "::group::$id $version ($mod)"
            if ./marketplace-cli publish "$mod"; then
              echo "$id $version" >> published.txt
            else
              echo "::error title=Publish failed::$id ($mod) — the previous version is still live"
              failed="$failed $id"
            fi
            echo "::endgroup::"
          done < changed.txt

          if [ -n "$failed" ]; then
            echo "Failed to publish:$failed" >&2
            exit 1
          fi

      # Retire what was deleted, after publishing rather than before: a module
      # whose id was rewritten in place reports as a publish of the new id and a
      # removal of the old one, and this order means the replacement is live
      # before the old row goes.
      #
      # --if-exists keeps each removal idempotent, so re-running a deploy that
      # failed later on doesn't fail again on modules the first attempt retired.
      - name: Remove deleted modules
        if: success() && steps.removed.outputs.any == 'true'
        env:
          # Removal is the one irreversible thing this workflow does: the row and
          # the R2 objects go, and installed copies lose their update path. A bad
          # base ref or a wholesale directory shuffle can make many modules look
          # deleted at once, so past this many the job stops and asks for a human
          # instead of guessing. Set the MAX_AUTO_REMOVALS repository variable to
          # raise it for a deliberate bulk retirement.
          MAX_REMOVALS: ${{ vars.MAX_AUTO_REMOVALS || 3 }}
        run: |
          set -euo pipefail

          count="$(grep -c . removed.txt || true)"
          if [ "$count" -gt "$MAX_REMOVALS" ]; then
            echo "::error title=Refusing to bulk-remove modules::$count modules look deleted, over the limit of $MAX_REMOVALS. Nothing was removed. Confirm the diff really retires all of them, then either raise the MAX_AUTO_REMOVALS repository variable or run 'marketplace-cli remove <id>' for each."
            exit 1
          fi

          failed=""
          while IFS=$'\t' read -r id path; do
            [ -z "$id" ] && continue
            echo "::group::remove $id (was $path)"
            if ./marketplace-cli remove --if-exists "$id" </dev/null; then
              echo "$id $path" >> retired.txt
            else
              echo "::error title=Remove failed::$id is still listed in the marketplace"
              failed="$failed $id"
            fi
            echo "::endgroup::"
          done < removed.txt

          if [ -n "$failed" ]; then
            echo "Failed to remove:$failed" >&2
            exit 1
          fi

      # Tags are the release history the marketplace itself doesn't keep — the
      # modules table stores only the current version per module, so without
      # these there's no record of what shipped when.
      - name: Tag published versions
        if: steps.changed.outputs.any == 'true'
        run: |
          set -euo pipefail
          [ -f published.txt ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while read -r id version; do
            [ -z "$id" ] && continue
            tag="$id@$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Tag $tag already exists, skipping"
              continue
            fi
            git tag -a "$tag" -m "$id $version"
            git push origin "$tag"
            echo "Tagged $tag"
          done < published.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "### Published modules"
            echo
            if [ -s published.txt ] 2>/dev/null; then
              echo "| Module | Version |"
              echo "|---|---|"
              while read -r id version; do
                [ -z "$id" ] && continue
                printf '| `%s` | %s |\n' "$id" "$version"
              done < published.txt
            else
              echo "_Nothing published._"
            fi
            echo
            echo "### Retired modules"
            echo
            if [ -s retired.txt ] 2>/dev/null; then
              echo "| Module | Was at |"
              echo "|---|---|"
              while read -r id path; do
                [ -z "$id" ] && continue
                printf '| `%s` | `%s` |\n' "$id" "$path"
              done < retired.txt
            else
              echo "_Nothing retired._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
